<!-- Tabs de período -->
<div class="flex w-full bg-white/90 backdrop-blur-sm">
  @for (tab of tabs; track tab.id) {
  <button class="flex-1 py-2 text-sm transition-colors" [class.font-bold]="activePeriodTab() === tab.id"
    [class.text-myfinance-green]="activePeriodTab() === tab.id"
    [class.border-b-2]="activePeriodTab() === tab.id"
    [class.border-myfinance-green]="activePeriodTab() === tab.id"
    [class.text-gray-400]="activePeriodTab() !== tab.id"
    (click)="onTabChange(tab.id)">{{ tab.label }}</button>
  }
</div>

<!-- Fila de navegación: chevrones + etiqueta/botón de rango -->
<div class="flex items-center justify-between mt-2 mb-1">
  <button class="p-2 text-myfinance-text-secondary" (click)="onNavigatePrev()" aria-label="Período anterior">
    <ion-icon name="chevron-back-outline" class="text-xl"></ion-icon>
  </button>

  @if (showCustomRange()) {
  <button class="flex items-center gap-1 px-3 py-1 rounded-full text-sm font-semibold"
    [class.bg-myfinance-green]="isCustomRange()" [class.text-white]="isCustomRange()"
    [class.text-myfinance-text-secondary]="!isCustomRange()" [class.bg-gray-100]="!isCustomRange()"
    (click)="onToggleCustomRange()">
    <ion-icon name="calendar-outline" class="text-base"></ion-icon>
    @if (isCustomRange()) {
    <span>Rango activo</span>
    <ion-icon name="close-outline" class="text-base"></ion-icon>
    } @else {
    <span>{{ periodLabel() }}</span>
    }
  </button>
  } @else {
  <span class="text-sm font-medium text-myfinance-text-secondary">{{ periodLabel() }}</span>
  }

  <button class="p-2 text-myfinance-text-secondary disabled:opacity-30" (click)="onNavigateNext()"
    [disabled]="!canNavigateForward()" aria-label="Período siguiente">
    <ion-icon name="chevron-forward-outline" class="text-xl"></ion-icon>
  </button>
</div>

<!-- Picker de rango personalizado — solo cuando showCustomRange e isCustomRange -->
@if (showCustomRange() && isCustomRange()) {
<div class="bg-white rounded-2xl px-4 py-3 mb-4 shadow-sm flex flex-col gap-3 border border-myfinance-border">
  <p class="text-xs font-bold text-myfinance-text-secondary uppercase tracking-wider">Rango personalizado</p>
  <div class="flex gap-3 items-center">
    <div class="flex-1">
      <p class="text-[10px] text-myfinance-text-secondary mb-1 font-semibold">DESDE</p>
      <ion-input type="date" [value]="customFrom()" (ionChange)="onCustomFromChange($event)" fill="outline"
        style="--border-radius: 8px; --padding-start: 8px; font-size: 0.875rem;">
      </ion-input>
    </div>
    <span class="text-myfinance-text-secondary font-bold mt-4">→</span>
    <div class="flex-1">
      <p class="text-[10px] text-myfinance-text-secondary mb-1 font-semibold">HASTA</p>
      <ion-input type="date" [value]="customTo()" (ionChange)="onCustomToChange($event)" fill="outline"
        style="--border-radius: 8px; --padding-start: 8px; font-size: 0.875rem;">
      </ion-input>
    </div>
  </div>
</div>
}
