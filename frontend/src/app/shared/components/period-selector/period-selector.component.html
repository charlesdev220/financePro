<div class="flex w-full bg-white/90 backdrop-blur-sm">
  @for (tab of tabs; track tab.id) {
  <button class="flex-1 py-2 text-sm transition-colors" [class.font-bold]="activeTab() === tab.id"
    [class.text-myfinance-green]="activeTab() === tab.id" [class.border-b-2]="activeTab() === tab.id"
    [class.border-myfinance-green]="activeTab() === tab.id" [class.text-gray-400]="activeTab() !== tab.id"
    (click)="selectPeriod(tab.id)">{{ tab.label }}</button>
  }
</div>
