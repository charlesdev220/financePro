<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/more"></ion-back-button>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: --color-green-50;">
  <div class="max-w-screen-sm mx-auto pt-4">
    <ion-list>
      @if (user) {
      <ion-item>
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ user.name }}</h2>
          <ion-note>{{ user.email }}</ion-note>
        </ion-label>
      </ion-item>
      }

      <ion-item [routerLink]="['/tabs/currencies']" detail>
        <ion-icon name="cash-outline" slot="start"></ion-icon>
        <ion-label>Divisas</ion-label>
      </ion-item>

      <ion-item button (click)="handleSignOut()" detail="false">
        <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
        <ion-label color="danger">Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
