<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Presupuestos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: var(--color-green-50);">
  <div class="max-w-screen-xl mx-auto pb-[calc(env(safe-area-inset-bottom)+80px)]">
    <app-period-selector [(activeTab)]="activePeriodTab"></app-period-selector>

    @if (budgets().length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
      @for (budget of budgets(); track budget.budgetId) {
      <div class="bg-white rounded-2xl border border-myfinance-border overflow-hidden">
        <ion-item-sliding style="width: 100%;">

          <ion-item (click)="openEditModal(budget)" button detail lines="none">
            <ion-label>
              <div class="flex items-center gap-2 mb-1">
                <div class="w-2.5 h-2.5 rounded-full flex-shrink-0" [style.backgroundColor]="budget.categoryColor">
                </div>
                <p class="text-sm font-semibold text-myfinance-text-primary m-0">{{ budget.categoryName }}</p>
              </div>
              <app-budget-indicator [budget]="budget" [userCurrency]="userBaseCurrency()"
                [catColor]="budget.categoryColor">
              </app-budget-indicator>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="deleteBudget(budget)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>

        </ion-item-sliding>
      </div>
      }
    </div>
    } @else {
    <div class="flex flex-col items-center justify-center py-16 gap-4 text-center">
      <ion-icon name="bar-chart-outline" class="text-6xl text-gray-300"></ion-icon>
      <p class="text-gray-400 text-sm">No hay presupuestos para este período.<br>Creá uno para controlar tus gastos.</p>
    </div>
    }
  </div>
</ion-content>

<!-- Barra de acción fija — mismo patrón que Dashboard -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md px-4 pb-3 pt-3 bg-myfinance-mint z-10"
  style="bottom: calc(env(safe-area-inset-bottom) + 56px);">
  <ion-button (click)="openAddModal()" expand="block" class="font-semibold"
    style="--background: var(--color-green-500); --background-activated: var(--color-green-700); --border-radius: 12px; text-transform: none;">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Crear presupuesto
  </ion-button>
</div>
