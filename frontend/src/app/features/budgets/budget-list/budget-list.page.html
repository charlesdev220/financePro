<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Presupuestos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: var(--color-green-50);">
  <div class="max-w-screen-xl mx-auto">
    <app-period-selector [period]="currentPeriod()" (periodChange)="onPeriodChange($event)">
    </app-period-selector>

    @if (budgets().length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
      @for (budget of budgets(); track budget.budgetId) {
      <div class="bg-white rounded-2xl border border-monefy-border overflow-hidden">
        <ion-item-sliding style="width: 100%;">
          <ion-item (click)="openEditModal(budget)" button detail lines="none">
            <ion-label>
              <p class="text-sm font-semibold text-monefy-text-primary mb-1">{{ getCategoryName(budget.categoryId) }}
              </p>
              <app-budget-indicator [budget]="budget" [userCurrency]="userBaseCurrency()"></app-budget-indicator>
            </ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="deleteBudget(budget)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </div>
      }
    </div>
    } @else {
    <div class="flex flex-col items-center justify-center py-16 gap-4 text-center">
      <ion-icon name="bar-chart-outline" class="text-6xl text-gray-300"></ion-icon>
      <p class="text-gray-400 text-sm">No hay presupuestos para este período.<br>Creá uno para controlar tus gastos.</p>
      <ion-button (click)="openAddModal()">Crear presupuesto</ion-button>
    </div>
    }
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openAddModal()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
