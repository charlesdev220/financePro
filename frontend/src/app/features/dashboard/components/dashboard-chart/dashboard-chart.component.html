<div class="relative flex flex-col items-center">
  @if (chartData()) {
    <div class="relative w-full aspect-square max-h-[280px]">
      <app-chart-pie [data]="chartData()"></app-chart-pie>
      
      <!-- Balance central (Monefy soul) -->
      <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <span class="text-xs uppercase font-bold text-monefy-text-secondary tracking-widest">Balance</span>
        <span class="text-2xl font-black text-monefy-text-primary tracking-tighter">
          {{ balance() | currencyFormat:currency() }}
        </span>
      </div>
    </div>

    <!-- Leyenda personalizada (Monefy style) -->
    <div class="flex flex-col gap-2 mt-4 px-2 w-full">
      @for (item of breakdownWithPct(); track item.categoryId) {
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full flex-shrink-0" [style.backgroundColor]="item.color"></div>
          <span class="text-sm font-semibold text-monefy-text-primary flex-1 truncate">{{ item.name }}</span>
          <span class="text-xs font-bold text-monefy-text-secondary mr-2">{{ item.pct }}%</span>
          <span class="text-sm text-monefy-text-secondary">{{ item.amount | currencyFormat:currency() }}</span>
        </div>
      }
    </div>
    
  } @else {
    <div class="flex items-center justify-center h-48 text-monefy-text-secondary text-sm italic">
      <p>Sin movimientos en este período</p>
    </div>
  }
</div>
