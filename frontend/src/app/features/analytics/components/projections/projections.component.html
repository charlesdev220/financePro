@if (hasEnoughData()) {
  <app-chart-bar
    [datasets]="datasets()"
    [labels]="labels()"
    type="line"
    ariaLabel="Proyección de tendencia de gastos"
  />
} @else {
  <div class="bg-gray-50 rounded-xl px-4 py-6 text-center text-sm text-gray-400">
    Necesitás al menos 3 meses de datos para ver la proyección.
  </div>
}
