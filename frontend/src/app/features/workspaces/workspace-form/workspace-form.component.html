<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEditMode ? 'Renombrar espacio' : 'Nuevo espacio' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: var(--color-green-50);">
  <ion-list>
    <ion-list-header>
      <ion-label class="font-semibold text-base">Datos del espacio</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-label position="stacked">Nombre del espacio</ion-label>
      <ion-input
        [value]="name()"
        (ionInput)="onNameInput($event)"
        placeholder="Ej: Trabajo, Familia..."
        clearInput>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Ícono</ion-label>
      <ion-input
        [value]="icon()"
        (ionInput)="onIconInput($event)"
        placeholder="🏠">
      </ion-input>
    </ion-item>
  </ion-list>

  <div class="px-4 mt-6">
    <ion-button expand="block" (click)="save()" [disabled]="isFormInvalid()">
      {{ isEditMode ? 'Guardar cambios' : 'Crear espacio' }}
    </ion-button>
  </div>
</ion-content>
