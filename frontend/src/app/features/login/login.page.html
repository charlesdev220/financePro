<ion-content class="bg-gradient-to-br from-app-surface to-app-bg flex items-center justify-center">
  <div class="max-w-[400px] w-full mx-auto px-6 py-12 animate-in fade-in slide-in-from-bottom-5 duration-700">
    <div class="text-center mb-12">
      <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
        <ion-icon name="wallet-outline" class="text-3xl text-white"></ion-icon>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">
        Finance<span class="text-indigo-500">Pro</span>
      </h1>
      <p class="text-slate-400 text-sm mt-2">Gestiona tus finanzas de forma inteligente</p>
    </div>

    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-6 shadow-2xl">
      <form (ngSubmit)="handleLogin()">
        <ion-item lines="none" class="bg-white/5 rounded-xl px-4 py-1 mb-4 flex items-center">
          <ion-icon name="mail-outline" slot="start" class="text-indigo-500 mr-2"></ion-icon>
          <ion-input
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            name="email"
            required
            class="text-white placeholder:text-slate-500"
          ></ion-input>
        </ion-item>

        <ion-item lines="none" class="bg-white/5 rounded-xl px-4 py-1 mb-6 flex items-center">
          <ion-icon name="lock-closed-outline" slot="start" class="text-indigo-500 mr-2"></ion-icon>
          <ion-input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            required
            class="text-white placeholder:text-slate-500"
          ></ion-input>
        </ion-item>

        <div class="space-y-4">
          <ion-button expand="block" type="submit" class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-semibold h-12 shadow-md shadow-indigo-500/20 text-white m-0 normal-case">
            Iniciar Sesión
          </ion-button>
          
          <ion-button fill="clear" expand="block" class="text-slate-400 text-xs normal-case">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>
      </form>
    </div>

    <div class="text-center mt-8 text-slate-400 text-sm">
      <p>¿No tienes cuenta? <span class="text-indigo-500 font-semibold cursor-pointer" routerLink="/register">Regístrate</span></p>
    </div>
  </div>
</ion-content>
