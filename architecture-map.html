<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MyFinance — Architecture Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; }

  #canvas { width: 100vw; height: 100vh; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  /* Legend */
  #legend {
    position: fixed; top: 20px; left: 20px;
    background: rgba(15,17,23,0.92); border: 1px solid #2d3748;
    border-radius: 12px; padding: 16px 20px; backdrop-filter: blur(12px);
    min-width: 200px;
  }
  #legend h3 { font-size: 11px; letter-spacing: 2px; color: #4a5568; text-transform: uppercase; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .15s; }
  .legend-item:hover { background: rgba(255,255,255,.05); }
  .legend-item.dimmed { opacity: .3; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* Tooltip */
  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(10,12,18,0.97); border: 1px solid #2d3748;
    border-radius: 10px; padding: 14px 18px; font-size: 12px;
    max-width: 320px; z-index: 1000; display: none; backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  #tooltip h4 { font-size: 14px; color: #f7fafc; margin-bottom: 6px; }
  #tooltip .file { color: #4a5568; font-size: 10px; margin-bottom: 10px; }
  #tooltip .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; margin-bottom: 10px; }
  #tooltip section { margin-bottom: 8px; }
  #tooltip section h5 { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #4a5568; margin-bottom: 4px; }
  #tooltip ul { list-style: none; }
  #tooltip ul li { font-size: 11px; color: #a0aec0; padding: 1px 0; }
  #tooltip ul li::before { content: '›  '; color: #4a5568; }

  /* Controls */
  #controls {
    position: fixed; bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctrl-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(45,55,72,.9); border: 1px solid #2d3748;
    color: #a0aec0; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .ctrl-btn:hover { background: rgba(74,85,104,.9); color: #f7fafc; }

  /* Search */
  #search-wrap {
    position: fixed; top: 20px; right: 20px;
    display: flex; gap: 8px; align-items: center;
  }
  #search {
    background: rgba(15,17,23,.92); border: 1px solid #2d3748;
    border-radius: 8px; padding: 8px 14px; color: #e2e8f0;
    font-size: 13px; font-family: inherit; width: 220px;
    backdrop-filter: blur(12px); outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: #5bad8f; }
  #search::placeholder { color: #4a5568; }

  /* Info bar */
  #info-bar {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(15,17,23,.85); border: 1px solid #2d3748;
    border-radius: 8px; padding: 8px 14px; font-size: 11px;
    color: #4a5568; backdrop-filter: blur(12px);
  }
  #info-bar span { color: #a0aec0; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="legend">
  <h3>Tipo de nodo</h3>
  <div class="legend-item" data-type="page">
    <div class="legend-dot" style="background:#5bad8f"></div><span>Page (smart)</span>
  </div>
  <div class="legend-item" data-type="component">
    <div class="legend-dot" style="background:#7cc4a4"></div><span>Component (dumb)</span>
  </div>
  <div class="legend-item" data-type="store">
    <div class="legend-dot" style="background:#e57373"></div><span>State Service</span>
  </div>
  <div class="legend-item" data-type="service">
    <div class="legend-dot" style="background:#f6ad55"></div><span>Service</span>
  </div>
  <div class="legend-item" data-type="pipe">
    <div class="legend-dot" style="background:#b794f4"></div><span>Pipe</span>
  </div>
  <div class="legend-item" data-type="model">
    <div class="legend-dot" style="background:#4a5568"></div><span>Model</span>
  </div>
  <div style="margin-top:14px; padding-top:12px; border-top:1px solid #2d3748">
    <h3 style="margin-bottom:10px">Tipo de relación</h3>
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#a0aec0;margin-bottom:6px">
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#5bad8f" stroke-width="2" stroke-dasharray="0"/></svg>
      Estado / Signal
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#a0aec0;margin-bottom:6px">
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#e57373" stroke-width="2" stroke-dasharray="4,3"/></svg>
      Modal / Abre
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#a0aec0;margin-bottom:6px">
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#f6ad55" stroke-width="2" stroke-dasharray="2,3"/></svg>
      Servicio
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#a0aec0">
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#b794f4" stroke-width="1.5" stroke-dasharray="0"/></svg>
      Componente hijo
    </div>
  </div>
</div>

<div id="search-wrap">
  <input id="search" type="text" placeholder="Buscar componente...">
</div>

<div id="tooltip"></div>

<div id="controls">
  <button class="ctrl-btn" id="zoom-in" title="Acercar">+</button>
  <button class="ctrl-btn" id="zoom-out" title="Alejar">−</button>
  <button class="ctrl-btn" id="zoom-reset" title="Reset" style="font-size:13px">⌂</button>
</div>

<div id="info-bar">
  <span id="node-count">—</span> nodos · <span id="edge-count">—</span> relaciones · Scroll para zoom · Drag para mover · Click para detalle
</div>

// ─── COLORS ──────────────────────────────────────────────────────────────────

  component: '#7cc4a4',
  store:     '#e57373',
  service:   '#f6ad55',
  pipe:      '#b794f4',
  model:     '#4a5568',
};

const EDGE_COLOR = {
  state:   '#5bad8f',
  modal:   '#e57373',
  service: '#f6ad55',
  child:   '#b794f4',
};

const EDGE_DASH = {
  state:   [],
  modal:   [6, 4],
  service: [2, 4],
  child:   [],
};

// Apply layout to nodes
NODES.forEach(n => {
  if (LAYOUT[n.id]) { n.x = LAYOUT[n.id].x; n.y = LAYOUT[n.id].y; }
  else { n.x = Math.random()*1600+100; n.y = Math.random()*900+100; }
});

// ─── CANVAS ENGINE ───────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H;
let transform = { x: 0, y: 0, scale: 0.65 };
let dragging = false, lastMouse = {x:0, y:0};
let hoveredNode = null;
let selectedNode = null;
let activeFilters = new Set(Object.keys(TYPE_COLOR));
let searchQuery = '';

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}

// Node size by type
function nodeRadius(n) {
  if (n.type === 'page')    return 28;
  if (n.type === 'store')   return 26;
  if (n.type === 'service') return 20;
  if (n.type === 'component') return 22;
  if (n.type === 'pipe')    return 16;
  if (n.type === 'model')   return 14;
  return 18;
}

function worldToScreen(wx, wy) {
  return {
    x: wx * transform.scale + transform.x,
    y: wy * transform.scale + transform.y,
  };
}
function screenToWorld(sx, sy) {
  return {
    x: (sx - transform.x) / transform.scale,
    y: (sy - transform.y) / transform.scale,
  };
}

function isNodeVisible(n) {
  if (!activeFilters.has(n.type)) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    return n.label.toLowerCase().includes(q) || n.file.toLowerCase().includes(q);
  }
  return true;
}

function isEdgeVisible(e) {
  const from = NODES.find(n=>n.id===e.from);
  const to   = NODES.find(n=>n.id===e.to);
  if (!from || !to) return false;
  if (!activeFilters.has(from.type) || !activeFilters.has(to.type)) return false;
  if (searchQuery) return isNodeVisible(from) || isNodeVisible(to);
  return true;
}

function drawArrow(x1,y1,x2,y2,color,dash,width=1.5) {
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist < 1) return;
  const nx = dx/dist, ny = dy/dist;
  const ex = x2 - nx*8, ey = y2 - ny*8; // end with arrowhead gap

  ctx.save();
  ctx.setLineDash(dash);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();

  // arrowhead
  const angle = Math.atan2(dy,dx);
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - 7*Math.cos(angle-0.4), ey - 7*Math.sin(angle-0.4));
  ctx.lineTo(ex - 7*Math.cos(angle+0.4), ey - 7*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawNode(n, highlight) {
  const s = worldToScreen(n.x, n.y);
  const r = nodeRadius(n) * transform.scale;
  const color = TYPE_COLOR[n.type] || '#4a5568';

  ctx.save();

  // Glow for selected/hovered
  if (highlight === 'selected') {
    ctx.shadowBlur = 24; ctx.shadowColor = color;
  } else if (highlight === 'hover') {
    ctx.shadowBlur = 14; ctx.shadowColor = color;
  }

  // Outer ring
  ctx.beginPath(); ctx.arc(s.x, s.y, r+2, 0, Math.PI*2);
  ctx.fillStyle = highlight ? color + '33' : 'transparent'; ctx.fill();

  // Main circle
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2);
  ctx.fillStyle = '#1a1f2e';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = highlight ? 2.5 : 1.5;
  ctx.stroke();

  // Inner dot
  ctx.beginPath(); ctx.arc(s.x, s.y, r*0.35, 0, Math.PI*2);
  ctx.fillStyle = color + (highlight ? 'ff' : 'aa');
  ctx.fill();

  ctx.restore();

  // Label
  const minScaleForLabel = n.type === 'model' ? 0.5 : 0.35;
  if (transform.scale > minScaleForLabel) {
    ctx.save();
    ctx.font = `${Math.max(9, Math.min(13, 11 * transform.scale))}px 'SF Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const alpha = Math.min(1, (transform.scale - minScaleForLabel) * 5);
    ctx.globalAlpha = highlight ? 1 : alpha * 0.8;
    ctx.fillStyle = highlight ? '#f7fafc' : '#a0aec0';
    // Wrap long labels
    const parts = n.label.replace(/Component|Service|Page|State|Pipe/, m => '\n'+m).split('\n');
    const lineH = 13 * transform.scale;
    parts.forEach((p, i) => ctx.fillText(p, s.x, s.y + r + 4 + i * lineH));
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);

  // BG grid
  ctx.save();
  ctx.strokeStyle = '#1a1f2e';
  ctx.lineWidth = 1;
  const gridSize = 80 * transform.scale;
  const offX = transform.x % gridSize, offY = transform.y % gridSize;
  for (let x = offX; x < W; x += gridSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = offY; y < H; y += gridSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();

  // Draw edges
  EDGES.forEach(e => {
    if (!isEdgeVisible(e)) return;
    const from = NODES.find(n=>n.id===e.from);
    const to   = NODES.find(n=>n.id===e.to);
    if (!from || !to) return;

    const fs = worldToScreen(from.x, from.y);
    const ts = worldToScreen(to.x, to.y);

    const isHighlighted = selectedNode &&
      (selectedNode.id===from.id || selectedNode.id===to.id);

    const color = EDGE_COLOR[e.type] || '#4a5568';
    const alpha = isHighlighted ? 1 : (selectedNode ? 0.08 : 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    drawArrow(fs.x, fs.y, ts.x, ts.y, color, EDGE_DASH[e.type]);

    // Edge label on hover
    if (e.label && isHighlighted && transform.scale > 0.4) {
      const mx = (fs.x+ts.x)/2, my = (fs.y+ts.y)/2;
      ctx.font = `${Math.max(8,9*transform.scale)}px 'SF Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.9;
      ctx.fillText(e.label, mx, my-6);
    }
    ctx.restore();
  });

  // Draw nodes
  const visibleNodes = NODES.filter(isNodeVisible);
  const dimmed = selectedNode !== null;

  visibleNodes.forEach(n => {
    const isConnected = selectedNode && (
      selectedNode.id === n.id ||
      EDGES.some(e => (e.from===selectedNode.id && e.to===n.id) || (e.to===selectedNode.id && e.from===n.id))
    );

    ctx.save();
    if (dimmed && !isConnected) ctx.globalAlpha = 0.12;

    const hl = n === selectedNode ? 'selected' : (n === hoveredNode ? 'hover' : null);
    drawNode(n, hl);
    ctx.restore();
  });
}

// ─── INTERACTION ─────────────────────────────────────────────────────────────
function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  let best = null, bestDist = Infinity;
  NODES.forEach(n => {
    if (!isNodeVisible(n)) return;
    const dx = n.x - w.x, dy = n.y - w.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const r = nodeRadius(n);
    if (dist < r + 4 && dist < bestDist) { best=n; bestDist=dist; }
  });
  return best;
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const mx = e.clientX, my = e.clientY;
  transform.x = mx + (transform.x - mx) * factor;
  transform.y = my + (transform.y - my) * factor;
  transform.scale = Math.max(0.15, Math.min(3, transform.scale * factor));
  draw();
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const n = getNodeAt(e.clientX, e.clientY);
  if (n) {
    selectedNode = selectedNode?.id === n.id ? null : n;
    if (selectedNode) showTooltip(e, selectedNode);
    else hideTooltip();
    draw();
  } else {
    dragging = true;
    lastMouse = {x:e.clientX, y:e.clientY};
    if (selectedNode) { selectedNode=null; hideTooltip(); draw(); }
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    transform.x += e.clientX - lastMouse.x;
    transform.y += e.clientY - lastMouse.y;
    lastMouse = {x:e.clientX, y:e.clientY};
    draw();
    return;
  }
  const n = getNodeAt(e.clientX, e.clientY);
  if (n !== hoveredNode) {
    hoveredNode = n;
    canvas.style.cursor = n ? 'pointer' : 'grab';
    draw();
  }
  if (selectedNode) updateTooltipPos(e);
});

canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging=false; hoveredNode=null; draw(); });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    lastMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    transform.x += e.touches[0].clientX - lastMouse.x;
    transform.y += e.touches[0].clientY - lastMouse.y;
    lastMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    draw();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    const factor = dist / lastTouchDist;
    transform.scale = Math.max(0.15, Math.min(3, transform.scale * factor));
    lastTouchDist = dist;
    draw();
  }
}, {passive:false});

canvas.addEventListener('touchend', () => { dragging=false; });

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
function showTooltip(e, n) {
  const connectedEdges = EDGES.filter(ed => ed.from===n.id || ed.to===n.id);
  const stateEdges   = connectedEdges.filter(ed=>ed.type==='state');
  const modalEdges   = connectedEdges.filter(ed=>ed.type==='modal');
  const serviceEdges = connectedEdges.filter(ed=>ed.type==='service');
  const childEdges   = connectedEdges.filter(ed=>ed.type==='child');

  const color = TYPE_COLOR[n.type];
  const typeLabel = {page:'Page',component:'Component',store:'State Service',service:'Service',pipe:'Pipe',model:'Model'}[n.type]||n.type;

  let html = `
    <h4>${n.label}</h4>
    <div class="file">${n.file}</div>
    <span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${typeLabel}</span>
  `;

  if (n.selectors?.length) {
    html += `<section><h5>Señales que consume</h5><ul>${n.selectors.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }
  if (n.dispatches?.length) {
    html += `<section><h5>Acciones que dispara</h5><ul>${n.dispatches.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }
  if (n.inputs?.length) {
    html += `<section><h5>Inputs recibe</h5><ul>${n.inputs.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }
  if (n.outputs?.length) {
    html += `<section><h5>Outputs emite</h5><ul>${n.outputs.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }
  if (modalEdges.length) {
    html += `<section><h5>Modales</h5><ul>${modalEdges.map(ed=>{
      const other = ed.from===n.id ? NODES.find(x=>x.id===ed.to) : NODES.find(x=>x.id===ed.from);
      const dir = ed.from===n.id ? '→ abre' : '← abierto por';
      return `<li>${dir} ${other?.label||'?'}</li>`;
    }).join('')}</ul></section>`;
  }
  if (serviceEdges.length) {
    const out = serviceEdges.filter(ed=>ed.from===n.id).map(ed=>NODES.find(x=>x.id===ed.to)?.label||'?');
    const inn = serviceEdges.filter(ed=>ed.to===n.id).map(ed=>NODES.find(x=>x.id===ed.from)?.label||'?');
    if (out.length) html += `<section><h5>Servicios que usa</h5><ul>${out.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
    if (inn.length) html += `<section><h5>Usado por</h5><ul>${inn.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }
  if (childEdges.length) {
    const children = childEdges.filter(ed=>ed.from===n.id).map(ed=>NODES.find(x=>x.id===ed.to)?.label||'?');
    const parents  = childEdges.filter(ed=>ed.to===n.id).map(ed=>NODES.find(x=>x.id===ed.from)?.label||'?');
    if (children.length) html += `<section><h5>Componentes hijos</h5><ul>${children.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
    if (parents.length)  html += `<section><h5>Usado en</h5><ul>${parents.map(s=>`<li>${s}</li>`).join('')}</ul></section>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  updateTooltipPos(e);
}

function updateTooltipPos(e) {
  if (!selectedNode) return;
  let x = e.clientX + 18, y = e.clientY - 10;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 10) x = e.clientX - r.width - 18;
  if (y + r.height > window.innerHeight - 10) y = window.innerHeight - r.height - 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() { tooltip.style.display = 'none'; }

// ─── CONTROLS ────────────────────────────────────────────────────────────────
document.getElementById('zoom-in').onclick = () => {
  transform.scale = Math.min(3, transform.scale * 1.2);
  transform.x = W/2 + (transform.x - W/2) * 1.2;
  transform.y = H/2 + (transform.y - H/2) * 1.2;
  draw();
};
document.getElementById('zoom-out').onclick = () => {
  transform.scale = Math.max(0.15, transform.scale * 0.83);
  transform.x = W/2 + (transform.x - W/2) * 0.83;
  transform.y = H/2 + (transform.y - H/2) * 0.83;
  draw();
};
document.getElementById('zoom-reset').onclick = () => {
  // Fit all nodes
  const xs = NODES.map(n=>n.x), ys = NODES.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad = 80;
  const scaleX = (W - pad*2) / (maxX - minX);
  const scaleY = (H - pad*2) / (maxY - minY);
  transform.scale = Math.min(scaleX, scaleY, 1);
  transform.x = pad - minX * transform.scale + (W - pad*2 - (maxX-minX)*transform.scale)/2;
  transform.y = pad - minY * transform.scale + (H - pad*2 - (maxY-minY)*transform.scale)/2;
  draw();
};

// Legend filter
document.querySelectorAll('.legend-item').forEach(item => {
  item.addEventListener('click', () => {
    const type = item.dataset.type;
    if (activeFilters.has(type)) {
      if (activeFilters.size > 1) { activeFilters.delete(type); item.classList.add('dimmed'); }
    } else { activeFilters.add(type); item.classList.remove('dimmed'); }
    selectedNode = null; hideTooltip(); draw();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  selectedNode = null; hideTooltip(); draw();
});

// Info bar
document.getElementById('node-count').textContent = NODES.length;
document.getElementById('edge-count').textContent = EDGES.length;

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resize);
resize();

// Auto-fit on load
setTimeout(() => {
  document.getElementById('zoom-reset').click();
}, 50);
</script>
